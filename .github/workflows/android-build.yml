name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false
    
    - name: Configure git user
      run: |
        git config --global user.email "ci@inkto.local"
        git config --global user.name "CI Builder"
        git config --global user.useConfigOnly true
    
    - name: Remove broken submodule from git
      run: |
        git rm --cached "Legal Text Ai Transcriber" 2>/dev/null || true
        rm -rf .git/modules/"Legal Text Ai Transcriber" 2>/dev/null || true
        git config --file=.gitmodules --remove-section submodule."Legal Text Ai Transcriber" 2>/dev/null || true
        git add -A
        git commit -m "Remove broken submodule" || true
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Install dependencies
      working-directory: ./frontend
      run: npm install
      
    - name: Build Next.js App
      working-directory: ./frontend
      run: npm run build
      
    - name: Sync Capacitor
      working-directory: ./frontend
      run: npx cap sync android
      
    - name: Build APK
      working-directory: ./frontend/android
      run: |
        chmod +x ./gradlew
        ./gradlew assembleDebug --debug 2>&1 | head -1000
      
    - name: Find and list APK files
      run: find frontend/android -type f -name "*.apk" -exec ls -lh {} \;
      
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: inkto-app-debug
        path: frontend/android/app/build/outputs/apk/debug/*.apk
        if-no-files-found: warn
