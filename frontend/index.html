    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How do I convert handwriting to text for free?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Upload a photo or scanned PDF of your handwritten document to Inkto. Our AI reads the handwriting and returns clean, editable text in under 60 seconds — completely free, no sign-up needed."
          }
        },
        {
          "@type": "Question",
          "name": "Can Inkto transcribe legal documents and affidavits?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Inkto is specifically designed for legal documents including affidavits, sworn statements, court filings, and other handwritten legal texts. It handles crossed-out words, caret insertions, and legal formatting with two-pass AI verification for accuracy."
          }
        },
        {
          "@type": "Question",
          "name": "What file formats does Inkto support?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Inkto accepts JPEG, PNG, and PDF files. You can upload up to 30 pages at once. The output can be copied as plain text or downloaded as a Microsoft Word (.docx) file."
          }
        },
        {
          "@type": "Question",
          "name": "Does Inkto work on mobile phones?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Inkto works in any mobile browser on Android and iPhone. You can take a photo directly with your camera and upload it. You can also add Inkto to your home screen for quick access."
          }
        },
        {
          "@type": "Question",
          "name": "How accurate is the handwriting recognition?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Inkto uses a two-pass AI verification process — the first pass transcribes the text, and the second pass specifically verifies numbers, dates, proper nouns, and legal terms against the original image for legal-grade accuracy."
          }
        },
        {
          "@type": "Question",
          "name": "Is my document data private and secure?",

          "@type": "Question",
          "name": "How can I access my transcription history?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "After transcribing, use the 'Inbox' or 'Save' button with your email address. You'll receive a secure magic link to view all your saved documents — no password needed. The link works on any device."
          }
        }
      ]
    }
